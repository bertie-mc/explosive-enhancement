name: Build and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    uses: bertie-mc/bertie-ci/.github/workflows/build-mod.yml@v4.0.0

  unit-test:
    uses: bertie-mc/bertie-ci/.github/workflows/unit-test.yml@v4.0.0

  client-test:
    needs: build
    uses: bertie-mc/bertie-ci/.github/workflows/client-test.yml@v4.0.0
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      build-test-mod: true
      success-marker: EXPLOSIVE_ENHANCEMENT_MIXIN_OK
